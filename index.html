<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Quizmaster</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#697386;--accent:#4f46e5;--good:#15803d;--line:#e5e7eb;--shadow:0 10px 30px rgba(17,24,39,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{min-height:100vh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
.top{max-width:1100px;margin:auto;padding:18px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:800}.brand small{font-size:12px;color:var(--muted)}
.screen{max-width:1100px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}.quiz-main{min-width:0}.side-board{position:sticky;top:18px}.side-board h3{text-align:center}.side-leader{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:12px;margin:6px 0;background:#f3f4f6}.side-leader.current{outline:2px solid #c7d2fe;background:#eef2ff}.side-rank{width:25px;text-align:center;font-weight:800}.side-name{flex:1;font-weight:750;font-size:14px}.side-points{font-weight:850}.side-turn{text-align:center;margin-top:14px;padding:10px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:800;font-size:13px}@media(max-width:850px){.quiz-layout{grid-template-columns:1fr}.side-board{position:static}.side-leaders{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.side-leader{margin:0}}

.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}.quiz-main{min-width:0}.side-board{position:sticky;top:18px;height:max-content}.side-board h3{text-align:center;margin-bottom:14px}.side-leader{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:12px;margin:6px 0;background:#f3f4f6}.side-leader.current{outline:2px solid #c7d2fe;background:#eef2ff}.side-rank{width:25px;text-align:center;font-weight:800}.side-name{flex:1;font-weight:750;font-size:14px}.side-points{font-weight:850}.side-turn{text-align:center;margin-top:14px;padding:10px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:800;font-size:13px}
@media(max-width:850px){.quiz-layout{grid-template-columns:1fr}.side-board{position:static}.side-leaders{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.side-leader{margin:0}}
.center{text-align:center}.muted{color:var(--muted)}
.btn{padding:14px 18px;border-radius:14px;font-weight:750;background:#eef0f5;color:var(--ink);min-height:48px;border:0;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}.btn.good{background:#dcfce7;color:#166534}.btn.danger{background:#fee2e2;color:#991b1b}.btn.big{font-size:20px;padding:18px 24px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;justify-content:center}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.round{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.question{font-size:34px;font-weight:800;line-height:1.18;margin:32px auto 20px;text-align:center;max-width:900px;min-height:82px;display:flex;align-items:center;justify-content:center}
.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;min-height:178px}
.regular-answer-area{min-height:178px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.regular-answer{font-size:28px;font-weight:850;color:#166534;margin-top:8px;max-width:850px}
.number-grid{display:grid;grid-template-columns:repeat(var(--grid-cols),1fr);gap:16px;max-width:760px;margin:30px auto 0}
.number-tile{aspect-ratio:1;border-radius:20px;border:2px solid var(--accent);background:#eef2ff;color:#312e81;font-size:34px;font-weight:850;cursor:pointer}
.number-tile:active{transform:scale(.97)}
.number-tile.taken{background:#e5e7eb;border-color:#d1d5db;color:#9ca3af;cursor:not-allowed}
@media(max-width:700px){.number-grid{gap:12px}.number-tile{font-size:28px}}
.answer{min-height:82px;border-radius:18px;background:#f0f2f7;font-size:21px;font-weight:750;padding:16px;text-align:left;border:0}.answer.selected{outline:4px solid #a5b4fc;background:#eef2ff}.answer.correct{background:#dcfce7;color:#166534}.answer.wrong{background:#fee2e2;color:#991b1b}
.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}.score{padding:10px;border-radius:12px;background:#f3f4f6;text-align:center}.score strong{display:block;font-size:20px}.score small{color:var(--muted)}
.score-actions{display:flex;justify-content:center;align-items:stretch;gap:14px;flex-wrap:wrap}.score-actions .score-btn{min-width:130px;text-align:center}.leader{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);border-radius:15px;margin:9px 0}.rank{font-size:26px;width:42px;text-align:center}.leader .name{flex:1;font-weight:800}.points{font-size:24px;font-weight:850}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:750}
input[type=file]{display:none}
.drop{border:2px dashed #cfd4df;border-radius:18px;padding:24px;text-align:center;margin-top:18px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal .card{max-width:650px;width:100%}
@media(max-width:700px){.answer-grid{grid-template-columns:1fr}.question{font-size:27px}.scorebar{grid-template-columns:repeat(2,1fr)}.card{padding:18px}}


/* =========================================================
   Quizmaster v8.5 — authoritative viewport layout
   The viewport belongs to .app. The header consumes one grid
   row; .screen receives only the remaining height.
   ========================================================= */
html, body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body {
  overscroll-behavior:none;
}

.app {
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  min-height:0;
  box-sizing:border-box;
  display:grid;
  grid-template-rows:46px minmax(0,1fr);
  overflow:hidden;
  padding:6px 14px;
}

.top {
  width:100%;
  max-width:none;
  height:46px;
  min-height:0;
  margin:0;
  padding:0;
  display:flex;
  align-items:center;
  box-sizing:border-box;
}

.screen {
  width:100%;
  height:auto;
  min-height:0;
  max-width:none;
  margin:0;
  overflow:hidden;
  box-sizing:border-box;
}

.quiz-layout {
  width:100%;
  height:100%;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,calc(100% - 292px)) 280px;
  gap:12px;
  align-items:stretch;
}

.quiz-main {
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  box-sizing:border-box;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.side-board {
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  box-sizing:border-box;
  overflow:hidden;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto;
}

.board-header {
  flex:0 0 auto;
  min-height:44px;
}

.quiz-main .number-grid {
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}

.quiz-main .answer-grid {
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}

.quiz-main .regular-answer-area {
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}

.side-leaders {
  min-height:0;
  overflow:hidden;
}

.side-next {
  flex:0 0 auto;
}

@media (orientation:portrait) {
  html, body {
    overflow:auto;
  }

  body {
    position:static;
  }

  .app {
    position:static;
    height:auto;
    min-height:100dvh;
    display:block;
    overflow:visible;
  }

  .top {
    height:46px;
  }

  .screen {
    height:auto;
    overflow:visible;
  }

  .quiz-layout {
    height:auto;
    grid-template-columns:1fr;
  }

  .quiz-main,
  .side-board {
    height:auto;
    min-height:0;
  }

  .side-board {
    display:flex;
    flex-direction:column;
  }
}

/* v8.5 visual sizing */
.version-badge {
  display:inline-block;
  margin-left:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#e9e7ff;
  color:#4f46e5;
  font-size:12px;
  font-weight:800;
  vertical-align:middle;
}

.side-board {
  background:linear-gradient(180deg,#151e3d,#0b122b);
  border:0;
  color:#fff;
  border-radius:20px;
  padding:16px;
  box-shadow:0 10px 30px rgba(11,18,43,.18);
}

.side-board h3 {
  color:#fff;
  font-size:24px;
  margin:0 0 8px;
}

.side-current {
  background:linear-gradient(135deg,#6159bd,#5149a8);
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  padding:10px 8px;
  margin:0 0 8px;
}

.side-leaders {
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

.side-leader {
  background:rgba(255,255,255,.07);
  color:#fff;
  border:1px solid transparent;
  min-height:50px;
  margin:4px 0;
  padding:9px 10px;
}

.side-leader.current {
  background:rgba(104,91,255,.18);
  border:2px solid #7c72ff;
}

.side-name { color:#fff; }
.side-points { color:#9b8cff; }

.side-next {
  margin:8px 0 0;
  padding:8px 0 0;
  border-top:1px solid rgba(255,255,255,.15);
}

.side-next .btn {
  width:100%;
  min-height:52px;
  font-size:19px;
  background:linear-gradient(135deg,#5147e8,#6b5cf5);
  color:#fff;
  border:0;
}

.board-header {
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.board-header h1 {
  font-size:26px;
  margin:0;
}

.quiz-main .number-grid {
  width:min(92%,820px);
  margin:8px auto;
  gap:10px;
  grid-auto-rows:minmax(0,1fr);
}

.quiz-main .number-tile {
  min-height:0;
  width:100%;
  height:100%;
  box-sizing:border-box;
  font-size:36px;
  border:2px solid #5147f5;
  background:#f1f2ff;
  color:#302b91;
  border-radius:18px;
}

.quiz-main .number-tile.taken {
  background:#e5e7eb;
  border-color:#d1d5db;
  color:#9ca3af;
}

.board-footer-hint {
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin:0 0 2px;
}

.quiz-main .actions {
  flex:0 0 auto;
  margin:4px 0;
}

.question {
  font-size:28px;
  min-height:50px;
  margin:4px auto 6px;
}

.quiz-main .answer-grid {
  width:min(92%,900px);
  margin:0 auto 6px;
  gap:10px;
}

.quiz-main .answer {
  min-height:0;
  border-radius:18px;
  font-size:22px;
}

.quiz-main .regular-answer-area {
  width:min(92%,900px);
  margin:0 auto 6px;
  border-radius:18px;
}

.quiz-main .regular-answer {
  font-size:30px;
}

.score-panel {
  flex:0 0 auto;
  background:#f4f2ff;
  border:1px solid #ddd9ff;
  border-radius:16px;
  padding:7px 10px 5px;
  margin:0;
}

.score-panel-title {
  text-align:center;
  font-weight:800;
  font-size:16px;
  margin-bottom:5px;
}

.score-actions {
  gap:8px;
}

.score-actions .score-btn {
  min-width:0;
  flex:1 1 0;
  min-height:46px;
  border-radius:14px;
  padding:7px 8px;
}

@media (max-height:700px) and (orientation:landscape) {
  .app {
    grid-template-rows:40px minmax(0,1fr);
    padding-top:3px;
    padding-bottom:3px;
  }
  .top { height:40px; }
  .board-header { min-height:38px; }
  .board-header h1 { font-size:23px; }
  .quiz-main .number-grid { margin:5px auto; gap:8px; }
  .quiz-main .number-tile { font-size:32px; }
  .question { font-size:25px; min-height:44px; margin:3px auto 5px; }
  .score-panel { padding:5px 8px 4px; }
  .score-actions .score-btn { min-height:42px; }
}

/* Quizmaster v8.7 — number grid fits both axes */
@media (orientation:landscape){
  .quiz-main .number-grid{
    width:100%;
    max-width:none;
    flex:1 1 auto;
    min-width:0;
    min-height:0;
    height:auto;
    margin:8px 0;
    padding:0 8px;
    box-sizing:border-box;
    display:grid;
    grid-template-columns:repeat(var(--grid-cols),minmax(0,1fr));
    grid-template-rows:repeat(var(--grid-rows),minmax(0,1fr));
    gap:10px;
    align-content:stretch;
    overflow:hidden;
  }
  .quiz-main .number-tile{
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;
    aspect-ratio:auto;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
  }
}


/* Quizmaster v8.8 — question/answer balance + colourful scoring */
@media (orientation:landscape){
  .quiz-main .question{
    flex:0 0 40%;
    height:auto;
    min-height:0;
    margin:4px 0 8px;
    width:100%;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px 22px;
  }

  .quiz-main .answer-grid,
  .quiz-main .regular-answer-area{
    flex:0 0 60%;
    height:auto;
    min-height:0;
    margin:0 0 8px;
    width:100%;
    box-sizing:border-box;
  }

  .quiz-main .answer-grid{
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:10px;
    padding:0 8px;
  }

  .quiz-main .regular-answer-area{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .quiz-main .actions{
    flex:0 0 auto;
  }

  .quiz-main .score-panel{
    flex:0 0 auto;
  }

  /* Preserve the colourful V8 scoring treatment. */
  .score-panel{
    background:linear-gradient(135deg,#f1efff,#fff4fb);
    border:1px solid #d9d2ff;
    box-shadow:0 4px 12px rgba(79,70,229,.08);
  }

  .score-actions .score-btn{
    border:0;
    color:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,.10);
  }

  .score-actions .score-btn:nth-child(1){background:#5146e5}
  .score-actions .score-btn:nth-child(2){background:#10a875}
  .score-actions .score-btn:nth-child(3){background:#f28c28}
  .score-actions .score-btn:nth-child(4){background:#2867d8}

  .score-actions .score-btn.good{
    transform:translateY(-2px);
    box-shadow:0 5px 12px rgba(0,0,0,.18);
    outline:3px solid rgba(255,255,255,.9);
  }

  .score-panel-title{
    color:#302b75;
  }
}

@media (orientation:landscape) and (max-height:700px){
  .quiz-main .question{
    flex-basis:40%;
    padding:6px 18px;
    font-size:25px;
  }
  .quiz-main .answer-grid,
  .quiz-main .regular-answer-area{
    flex-basis:60%;
  }
  .score-panel{padding:5px 8px 4px}
  .score-panel-title{font-size:15px;margin-bottom:4px}
  .score-actions .score-btn{min-height:40px}
}


@media (orientation:landscape){
  .quiz-main .question-zone{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .quiz-main .question-zone .question{
    flex:0 0 40%;
    height:auto;
    min-height:0;
    margin:0 0 6px;
  }
  .quiz-main .question-zone .answer-grid,
  .quiz-main .question-zone .regular-answer-area{
    flex:0 0 60%;
    height:auto;
    min-height:0;
    margin:0;
  }
  .quiz-main .question-zone .answer-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:10px;
    padding:0 8px;
    box-sizing:border-box;
  }
  .quiz-main .question-zone .regular-answer-area{
    box-sizing:border-box;
  }
}


/* Quizmaster v8.9 — MCQ choice border inset */
@media (orientation:landscape){
  .quiz-main .question-zone .answer-grid{
    width:100%;
    padding:6px;
    margin:0;
    box-sizing:border-box;
    overflow:hidden;
  }
  .quiz-main .question-zone .answer-grid .answer{
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;
    box-sizing:border-box;
  }
}

</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">🎯 Quizmaster <span class="version-badge">v9.0</span></div></header>
<main id="app" class="screen"></main>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
